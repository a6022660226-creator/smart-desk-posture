<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科展姿勢檢測系統（橫豎屏自適應防拉扯版）</title>
    <!-- 載入 MediaPipe Pose -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 1.1rem; margin-bottom: 3px; text-align: center; }
        .subtitle { font-size: 0.75rem; color: #aaa; margin-bottom: 8px; text-align: center; }
        
        .container {
            position: relative;
            width: 100%;
            max-width: 650px; 
            /* 📱 智慧自適應：橫屏時維持寬扁，豎屏時自動拉高，絕不變形拉扯 */
            aspect-ratio: auto;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        video { display: none; }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            max-height: 75vh;
            object-fit: contain; /* 確保相機畫面維持原本比例，不裁切、不拉扯 */
            transform: scaleX(-1); /* 水平鏡像 */
        }
        
        .overlay-ui {
            position: absolute;
            top: 10px;
            right: 10px;
            text-align: right;
            font-size: 0.85rem;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
            pointer-events: none;
            line-height: 1.4;
        }

        .input-group {
            margin-top: 10px;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .input-group label {
            font-size: 0.9rem;
            font-weight: bold;
        }

        .input-group input, .input-group select {
            padding: 8px 12px;
            font-size: 0.95rem;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #222;
            color: #fff;
            text-align: center;
        }
        .input-group input { width: 150px; }
        .input-group select { width: 140px; }

        .controls {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 9px 16px;
            font-size: 0.9rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: #fff;
        }
        .btn-calib { background-color: #ff9500; }
        .btn-start { background-color: #007aff; }
        .btn-stop { background-color: #ff3b30; display: none; }
        .btn-csv { background-color: #34c759; }
        button:disabled { background-color: #555; opacity: 0.6; cursor: not-allowed; }

        .log-box {
            margin-top: 8px;
            width: 100%;
            max-width: 650px;
            background: #1e1e1e;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            max-height: 80px;
            overflow-y: auto;
            color: #ccc;
        }
    </style>
</head>
<body>

    <h1>智慧型姿勢檢測系統（橫豎屏自適應版）</h1>
    <div class="subtitle">支援橫屏/豎屏自動適應不拉扯 | 停止測試可重選慣用手 | 隨時可重新校準</div>

    <div class="container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
        <div class="overlay-ui" id="statusText">初始化 AI 模型中...</div>
    </div>

    <!-- 學生設定區：姓名與慣用手 -->
    <div class="input-group">
        <div>
            <label for="userName">受測者姓名/座號：</label>
            <input type="text" id="userName" placeholder="例如：王小明" value="受測者">
        </div>
        <div>
            <label for="handednessSelect">慣用手 / 側身方向：</label>
            <select id="handednessSelect">
                <option value="right" selected>右手 (側向左邊)</option>
                <option value="left">左手 (側向右邊)</option>
            </select>
        </div>
    </div>

    <div class="controls">
        <button class="btn-calib" id="calibBtn">🎯 坐姿校準 (C)</button>
        <button class="btn-start" id="startTestBtn" disabled>▶️ 開始測試</button>
        <button class="btn-stop" id="stopTestBtn">⏹️ 停止測試</button>
        <button class="btn-csv" id="downloadCsvBtn">📊 手動下載 CSV</button>
    </div>

    <div class="log-box" id="logBox">系統日誌：請選擇慣用手，將手機/iPad擺放好，輸入姓名後坐端正點擊「坐姿校準」。</div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusText = document.getElementById('statusText');
        const userNameInput = document.getElementById('userName');
        const handednessSelect = document.getElementById('handednessSelect');
        const calibBtn = document.getElementById('calibBtn');
        const startTestBtn = document.getElementById('startTestBtn');
        const stopTestBtn = document.getElementById('stopTestBtn');
        const downloadCsvBtn = document.getElementById('downloadCsvBtn');
        const logBox = document.getElementById('logBox');

        let csvRecords = [["Timestamp", "Name", "Handedness", "Test_A_Diff", "Status_A", "Test_B_ShrungRatio", "Status_B", "Test_C_Score", "Status_C", "Overall_Result"]];
        let currentData = { diffA: 0, statusA: "Waiting", ratioB: 0, statusB: "Waiting", scoreC: 0, statusC: "Waiting" };
        
        let baselineA = null;
        let baselineEarShoulderDist = null;
        let isCalibrated = false;
        let isTesting = false;
        let autoRecordTimer = null;

        const THRESHOLD_A = 15.0; // 烏龜頸角度變化門檻
        const THRESHOLD_B_SHRINK = 0.18; // 聳肩：耳肩距離縮短超過 18% 即視為聳肩

        function log(msg) {
            logBox.innerHTML += `<br>${msg}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // 🔊 瀏覽器內建 Web Audio API 發出嗶聲警示音
        function playBeepSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5 音符
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            } catch (e) {
                console.log("音效播放失敗: ", e);
            }
        }

        function getFormattedDateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }

        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);

        async function startCamera() {
            try {
                log("正在請求相機權限...");
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                videoElement.srcObject = stream;
                await videoElement.play();

                canvasElement.width = videoElement.videoWidth || 1280;
                canvasElement.height = videoElement.videoHeight || 720;

                log(`相機啟動成功！`);
                requestAnimationFrame(sendVideoFrame);
            } catch (err) {
                log("【錯誤】無法啟動相機：" + err.message);
                statusText.innerHTML = "相機啟動失敗，請檢查權限";
            }
        }

        async function sendVideoFrame() {
            if (videoElement.readyState >= 2) {
                await pose.send({ image: videoElement });
            }
            requestAnimationFrame(sendVideoFrame);
        }

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            const w = canvasElement.width;
            const h = canvasElement.height;

            if (results.poseLandmarks) {
                const landmarks = results.poseLandmarks;
                const nose = landmarks[0];

                let activeEarIdx;
                let activeShIdx;
                if (handednessSelect.value === 'right') {
                    activeEarIdx = 7;   // 左耳
                    activeShIdx = 11;  // 左肩
                } else {
                    activeEarIdx = 8;   // 右耳
                    activeShIdx = 12;  // 右肩
                }

                const activeEar = landmarks[activeEarIdx];
                const activeSh = landmarks[activeShIdx];
                
                const leftEar = landmarks[7];
                const rightEar = landmarks[8];
                const leftShoulder = landmarks[11];
                const rightShoulder = landmarks[12];

                const ear_x = activeEar.x * w, ear_y = activeEar.y * h;
                const sh_x = activeSh.x * w, sh_y = activeSh.y * h;
                
                const l_ear_x = leftEar.x * w, l_ear_y = leftEar.y * h;
                const r_ear_x = rightEar.x * w, r_ear_y = rightEar.y * h;
                const l_sh_x = leftShoulder.x * w, l_sh_y = leftShoulder.y * h;
                const r_sh_x = rightShoulder.x * w, r_sh_y = rightShoulder.y * h;
                const nose_x = nose.x * w, nose_y = nose.y * h;

                // 頭部馬賽克
                let min_x = Math.min(nose_x, ear_x), max_x = Math.max(nose_x, ear_x);
                let hx1 = Math.max(0, Math.floor(min_x - 50)), hx2 = Math.min(w, Math.ceil(max_x + 50));
                let base_y = Math.min(nose_y, ear_y);
                let hy1 = Math.max(0, Math.floor(base_y - 110)), hy2 = Math.min(h, Math.ceil(base_y + 90));
                let fw = hx2 - hx1, fh = hy2 - hy1;
                
                if (fw > 0 && fh > 0) {
                    canvasCtx.imageSmoothingEnabled = false;
                    canvasCtx.drawImage(canvasElement, hx1, hy1, fw, fh, hx1, hy1, 15, 15);
                    canvasCtx.drawImage(canvasElement, hx1, hy1, 15, 15, hx1, hy1, fw, fh);
                    canvasCtx.imageSmoothingEnabled = true;
                }

                let dx_a = ear_x - sh_x, dy_a = sh_y - ear_y;
                let raw_angle_A = Math.atan2(Math.abs(dx_a), dy_a !== 0 ? Math.abs(dy_a) : 1) * 180 / Math.PI;

                let currentEarShoulderDist = Math.abs(sh_y - ear_y);

                // 🎨 繪製連線與標記
                drawLine(l_ear_x, l_ear_y, r_ear_x, r_ear_y, "#ffff00", 2);
                drawLine(l_sh_x, l_sh_y, r_sh_x, r_sh_y, "#ff00ff", 2);
                drawLine(sh_x, sh_y, ear_x, ear_y, "#00ff00", 3);
                drawLine(sh_x, sh_y, sh_x, sh_y - 100, "#ffffff", 1);

                drawCircle(l_ear_x, l_ear_y, 7, "#ffff00");
                drawCircle(r_ear_x, r_ear_y, 7, "#ffff00");
                drawCircle(l_sh_x, l_sh_y, 8, "#ff00ff");
                drawCircle(r_sh_x, r_sh_y, 8, "#ff00ff");

                if (!isCalibrated) {
                    statusText.innerHTML = `<span style="color:#ffcc00; font-size:1.1rem;">請確認慣用手，坐端正後點擊校準</span>`;
                    window.tempA = raw_angle_A;
                    window.tempDistB = currentEarShoulderDist;
                } else {
                    let diff_A = Math.round((raw_angle_A - baselineA) * 10) / 10;
                    
                    let shrinkRatio = (baselineEarShoulderDist - currentEarShoulderDist) / baselineEarShoulderDist;
                    let shrinkPercent = Math.round(shrinkRatio * 100);

                    let status_A = "Normal";
                    if (diff_A >= THRESHOLD_A) {
                        status_A = "Warning (烏龜頸)";
                    }

                    let status_B = "Normal";
                    if (shrinkRatio >= THRESHOLD_B_SHRINK) {
                        status_B = "Warning (聳肩)";
                    }
                    
                    let isBadC = false;
                    if (status_A.includes("Warning") || status_B.includes("Warning")) {
                        isBadC = true;
                    }

                    let status_C = "Good (良好)";
                    if (isBadC) {
                        status_C = "Bad (姿勢不良)";
                    }

                    currentData = { 
                        diffA: diff_A, 
                        statusA: status_A, 
                        ratioB: shrinkPercent, 
                        statusB: status_B, 
                        scoreC: isBadC ? 1 : 0, 
                        statusC: status_C 
                    };

                    let colorA;
                    if (diff_A >= THRESHOLD_A) {
                        colorA = "#ff4d4d";
                    } else {
                        colorA = "#4cd964";
                    }

                    let colorB;
                    if (shrinkRatio >= THRESHOLD_B_SHRINK) {
                        colorB = "#ff4d4d";
                    } else {
                        colorB = "#4cd964";
                    }

                    let colorC;
                    if (isBadC) {
                        colorC = "#ff4d4d";
                    } else {
                        colorC = "#4cd964";
                    }

                    let testStatusStr;
                    if (isTesting) {
                        testStatusStr = "🔴 [測驗進行中]";
                    } else {
                        testStatusStr = "⏸️ [校準完成]";
                    }

                    statusText.innerHTML = `
                        <span style="font-size:0.85rem;">${testStatusStr}</span><br>
                        <span style="color:${colorA}">[A] 頸部變化: +${diff_A}°</span><br>
                        <span style="color:${colorB}">[B] 聳肩幅度: ${shrinkPercent}%</span><br>
                        <span style="color:${colorC}">[C] 綜合狀態: ${status_C}</span>
                    `;
                }
            } else {
                statusText.innerHTML = "未偵測到身體，請調整相機角度";
            }
            canvasCtx.restore();
        }

        function triggerCalibration() {
            if (window.tempA !== undefined && window.tempDistB !== undefined) {
                baselineA = window.tempA;
                baselineEarShoulderDist = window.tempDistB;
                isCalibrated = true;
                
                startTestBtn.disabled = false;
                userNameInput.disabled = true;
                handednessSelect.disabled = true;

                csvRecords = [["Timestamp", "Name", "Handedness", "Test_A_Diff", "Status_A", "Test_B_ShrungRatio", "Status_B", "Test_C_Score", "Status_C", "Overall_Result"]];

                let handText = handednessSelect.value === 'right' ? "右手(側左)" : "左手(側右)";
                const nameVal = userNameInput.value.trim() || "受測者";
                log(`【重新校準成功】受測者：${nameVal} | 慣用手：${handText}`);
            } else {
                alert("尚未偵測到身體關節，請坐在鏡頭前再試一次！");
            }
        }

        calibBtn.addEventListener('click', triggerCalibration);
        window.addEventListener('keydown', (e) => {
            if (e.key === 'c' || e.key === 'C') triggerCalibration();
        });

        function exportCsvFile() {
            if (csvRecords.length <= 1) {
                alert("目前尚無累積數據！");
                return;
            }
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF" + csvRecords.map(e => e.join(",")).join("\n");
            const link = document.createElement('a');
            link.href = encodeURI(csvContent);
            
            const rawName = userNameInput.value.trim() || "User";
            const safeName = rawName.replace(/[/\\?%*:|"<>]/g, "_");
            const nowStr = getFormattedDateTime().replace(/[: ]/g, "_");
            link.download = `${safeName}_${nowStr}.csv`;
            link.click();
            log(`【成功】CSV 檔案已下載`);
        }

        startTestBtn.addEventListener('click', () => {
            if (!isCalibrated) return;
            isTesting = true;
            startTestBtn.style.display = 'none';
            stopTestBtn.style.display = 'inline-block';

            log(`【測試開始】每 5 秒自動記錄數據...`);

            if (autoRecordTimer) clearInterval(autoRecordTimer);
            autoRecordTimer = setInterval(() => {
                if (isTesting && isCalibrated) {
                    const fullDateTime = getFormattedDateTime();
                    const nameVal = userNameInput.value.trim() || "User";
                    let handVal = handednessSelect.value === 'right' ? "右手(側左)" : "左手(側右)";

                    const isBadA = currentData.statusA.includes("Warning");
                    const isBadB = currentData.statusB.includes("Warning");
                    let overallResult = (isBadA || isBadB) ? "Bad (不良)" : "Good (良好)";

                    csvRecords.push([
                        fullDateTime, nameVal, handVal,
                        currentData.diffA, currentData.statusA, 
                        currentData.ratioB + "%", currentData.statusB, 
                        currentData.scoreC, currentData.statusC, overallResult
                    ]);

                    if (overallResult.includes("Bad")) {
                        playBeepSound();
                        log(`⚠️ [警告] ${fullDateTime} 偵測到不良姿勢！已發出嗶聲。`);
                    } else {
                        log(`[紀錄] ${fullDateTime} ➔ 姿勢正常`);
                    }
                }
            }, 5000);
        });

        stopTestBtn.disabled = false;
        stopTestBtn.addEventListener('click', () => {
            isTesting = false;
            stopTestBtn.style.display = 'none';
            startTestBtn.style.display = 'inline-block';
            
            userNameInput.disabled = false;
            handednessSelect.disabled = false;
            isCalibrated = false;
            startTestBtn.disabled = true;

            if (autoRecordTimer) clearInterval(autoRecordTimer);
            log(`【測試停止】已解鎖姓名與慣用手設定。`);
        });

        function drawCircle(x, y, radius, color) {
            canvasCtx.fillStyle = color;
            canvasCtx.beginPath();
            canvasCtx.arc(x, y, radius, 0, 2 * Math.PI);
            canvasCtx.fill();
        }

        function drawLine(x1, y1, x2, y2, color, width) {
            canvasCtx.strokeStyle = color;
            canvasCtx.lineWidth = width;
            canvasCtx.beginPath();
            canvasCtx.moveTo(x1, y1);
            canvasCtx.lineTo(x2, y2);
            canvasCtx.stroke();
        }

        downloadCsvBtn.addEventListener('click', exportCsvFile);
        startCamera();
    </script>
</body>
</html>
